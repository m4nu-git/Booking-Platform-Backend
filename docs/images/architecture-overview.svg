<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="840" viewBox="0 0 1400 840" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6B7280"/></marker>
  <marker id="ah-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  <marker id="ah-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#D97706"/></marker>
  <marker id="ah-v" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  <marker id="ah-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.10)"/>
  </filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.2" fill="#E2E8F0"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="1400" height="840" fill="#F8FAFC"/>
<rect width="1400" height="840" fill="url(#dots)"/>

<!-- Title -->
<text x="700" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Airbnb Platform — Architecture Overview</text>

<!-- ── CLIENT ── -->
<rect x="520" y="60" width="360" height="68" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" filter="url(#sh)"/>
<text x="700" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">Client Browser / Mobile App</text>
<text x="700" y="113" text-anchor="middle" font-size="11" fill="#7C3AED">HTTP/HTTPS · JWT Bearer Token on every request</text>

<!-- Client → Gateway arrow -->
<line x1="700" y1="128" x2="700" y2="175" stroke="#6B7280" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="710" y="142" width="60" height="18" rx="5" fill="#F1F5F9"/>
<text x="741" y="155" text-anchor="middle" font-size="10" fill="#6B7280">JWT Auth</text>

<!-- ── API GATEWAY ── -->
<rect x="42" y="180" width="1100" height="112" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5" filter="url(#sh)"/>
<text x="592" y="210" text-anchor="middle" font-size="19" font-weight="700" fill="#991B1B">API Gateway + Auth Service  (Go · :8080)</text>
<text x="592" y="232" text-anchor="middle" font-size="11.5" fill="#DC2626">JWT Auth (HS256 15 min)  ·  RBAC (user / admin)  ·  Rate Limit 5 req/s per IP  ·  Reverse Proxy  ·  CORS</text>
<text x="592" y="252" text-anchor="middle" font-size="11" fill="#991B1B">Auth Routes: /login  /signup  /refresh  /logout  /profile  /change-password  /forgot-password  /reset-password</text>
<text x="592" y="271" text-anchor="middle" font-size="11" fill="#B91C1C">Proxy Routes: /hotelService/*  /bookingService/*  /notificationService/*  /reviewService/*</text>

<!-- Auth MySQL (right of gateway) -->
<rect x="1160" y="183" width="215" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#sh)"/>
<text x="1267" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">MySQL — auth_dev</text>
<text x="1267" y="222" text-anchor="middle" font-size="10" fill="#2563EB">users · roles · permissions · user_roles</text>

<!-- Token tables -->
<rect x="1160" y="244" width="215" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
<text x="1267" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">MySQL — Token Tables</text>
<text x="1267" y="283" text-anchor="middle" font-size="10" fill="#047857">refresh_tokens · password_reset_tokens</text>

<!-- Gateway → Auth MySQL arrow -->
<line x1="1142" y1="210" x2="1158" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-b)"/>
<line x1="1142" y1="268" x2="1158" y2="268" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah-g)"/>

<!-- Gateway → Services arrows (dashed = proxy) -->
<!-- service centers: 170, 440, 710, 980 -->
<line x1="170" y1="292" x2="170" y2="337" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<line x1="440" y1="292" x2="440" y2="337" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<line x1="710" y1="292" x2="710" y2="337" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<line x1="980" y1="292" x2="980" y2="337" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ah)"/>

<!-- proxy label -->
<rect x="768" y="300" width="95" height="18" rx="5" fill="#F1F5F9"/>
<text x="815" y="313" text-anchor="middle" font-size="10" fill="#6B7280">proxy / JWT</text>

<!-- ── SERVICES ROW (y=340, h=105) ── -->
<!-- Hotel Service: center x=170, box x=55 w=230 -->
<rect x="55" y="340" width="230" height="105" rx="13" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" filter="url(#sh)"/>
<text x="170" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#0369A1">Hotel Service</text>
<text x="170" y="387" text-anchor="middle" font-size="11" fill="#0284C7">TypeScript · Node.js · :3000</text>
<text x="170" y="403" text-anchor="middle" font-size="10.5" fill="#075985">/hotels  /rooms  /search  /release</text>
<text x="170" y="419" text-anchor="middle" font-size="10.5" fill="#075985">CRUD · Availability Check · ES Indexing</text>
<text x="170" y="436" text-anchor="middle" font-size="10" fill="#64748B">MySQL · Redis · Elasticsearch</text>

<!-- Booking Service: center x=440, box x=325 w=230 -->
<rect x="325" y="340" width="230" height="105" rx="13" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" filter="url(#sh)"/>
<text x="440" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">Booking Service</text>
<text x="440" y="387" text-anchor="middle" font-size="11" fill="#D97706">TypeScript · Node.js · :3001</text>
<text x="440" y="403" text-anchor="middle" font-size="10.5" fill="#78350F">/bookings  /confirm  /expire</text>
<text x="440" y="419" text-anchor="middle" font-size="10.5" fill="#78350F">RedLock · Idempotency · Cron Cleanup</text>
<text x="440" y="436" text-anchor="middle" font-size="10" fill="#64748B">MySQL · Redis (BullMQ + RedLock)</text>

<!-- Notification Service: center x=710, box x=595 w=230 -->
<rect x="595" y="340" width="230" height="105" rx="13" fill="#D1FAE5" stroke="#059669" stroke-width="2.5" filter="url(#sh)"/>
<text x="710" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">Notification Service</text>
<text x="710" y="384" text-anchor="middle" font-size="11" fill="#059669">TypeScript · Node.js · :3002</text>
<text x="710" y="400" text-anchor="middle" font-size="10.5" fill="#065F46">/email/send</text>
<text x="710" y="416" text-anchor="middle" font-size="10.5" fill="#065F46">BullMQ Workers · Handlebars Templates</text>
<text x="710" y="436" text-anchor="middle" font-size="10" fill="#64748B">Redis Queue · Nodemailer · SMTP</text>

<!-- Review Service: center x=980, box x=865 w=230 -->
<rect x="865" y="340" width="230" height="105" rx="13" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" filter="url(#sh)"/>
<text x="980" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#3730A3">Review Service</text>
<text x="980" y="387" text-anchor="middle" font-size="11" fill="#4F46E5">Go · :4000</text>
<text x="980" y="403" text-anchor="middle" font-size="10.5" fill="#3730A3">/reviews  /ratings</text>
<text x="980" y="419" text-anchor="middle" font-size="10.5" fill="#3730A3">Cron Rating Aggregation</text>
<text x="980" y="436" text-anchor="middle" font-size="10" fill="#64748B">MySQL</text>

<!-- ── INTERNAL SERVICE CALLS ── -->
<!-- Booking → Hotel (availability check): in gap between x=285 and x=325 -->
<line x1="325" y1="378" x2="288" y2="378" stroke="#D97706" stroke-width="2" marker-end="url(#ah-o)"/>
<rect x="282" y="355" width="50" height="18" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="307" y="368" text-anchor="middle" font-size="9" fill="#78350F">avail?</text>

<!-- Review → Hotel (rating push): path below services -->
<path d="M 980 445 L 980 475 L 170 475 L 170 445" stroke="#4F46E5" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#ah-v)"/>
<rect x="525" y="466" width="150" height="17" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="600" y="478" text-anchor="middle" font-size="10" fill="#3730A3">push rating update</text>

<!-- Auth → Notification (password reset email) -->
<!-- Already shown via gateway arrow, add label -->
<rect x="618" y="296" width="85" height="17" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
<text x="660" y="308" text-anchor="middle" font-size="9" fill="#065F46">reset email</text>

<!-- ── DATA STORES ── -->
<!-- Services → DB arrows -->
<line x1="120" y1="445" x2="120" y2="493" stroke="#0284C7" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="220" y1="445" x2="220" y2="493" stroke="#0284C7" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="440" y1="445" x2="440" y2="493" stroke="#D97706" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="710" y1="445" x2="710" y2="493" stroke="#059669" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="980" y1="445" x2="980" y2="493" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah)"/>

<!-- HOTEL DBs -->
<rect x="55" y="495" width="110" height="52" rx="10" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
<text x="110" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">MySQL</text>
<text x="110" y="536" text-anchor="middle" font-size="10" fill="#2563EB">hotel_db</text>

<rect x="175" y="495" width="110" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="230" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">Redis</text>
<text x="230" y="536" text-anchor="middle" font-size="10" fill="#DC2626">room queues</text>

<rect x="55" y="560" width="230" height="52" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="170" y="583" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Elasticsearch</text>
<text x="170" y="601" text-anchor="middle" font-size="10" fill="#B45309">hotel search index · full-text queries</text>

<!-- BOOKING DBs -->
<rect x="330" y="495" width="110" height="52" rx="10" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
<text x="385" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">MySQL</text>
<text x="385" y="536" text-anchor="middle" font-size="10" fill="#2563EB">booking_db</text>

<rect x="450" y="495" width="110" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="505" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">Redis</text>
<text x="505" y="536" text-anchor="middle" font-size="10" fill="#DC2626">BullMQ + RedLock</text>

<!-- NOTIFICATION DBs -->
<rect x="600" y="495" width="110" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="655" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">Redis</text>
<text x="655" y="536" text-anchor="middle" font-size="10" fill="#DC2626">email job queue</text>

<rect x="720" y="495" width="110" height="52" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<text x="775" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">Nodemailer</text>
<text x="775" y="536" text-anchor="middle" font-size="10" fill="#059669">SMTP / Email</text>

<!-- REVIEW DB -->
<rect x="870" y="495" width="220" height="52" rx="10" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
<text x="980" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">MySQL</text>
<text x="980" y="536" text-anchor="middle" font-size="10" fill="#2563EB">review_db · ratings · user reviews</text>

<!-- ── LEGEND ── -->
<rect x="42" y="650" width="1100" height="165" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="592" y="675" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Legend  /  Key Patterns</text>

<!-- Solid arrow -->
<line x1="75" y1="700" x2="135" y2="700" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
<text x="145" y="705" font-size="11" fill="#334155">Direct HTTP call (authenticated)</text>

<!-- Dashed arrow -->
<line x1="75" y1="726" x2="135" y2="726" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="145" y="731" font-size="11" fill="#334155">Reverse proxy (JWT stripped, X-User-ID injected)</text>

<!-- Orange arrow -->
<line x1="75" y1="752" x2="135" y2="752" stroke="#D97706" stroke-width="2" marker-end="url(#ah-o)"/>
<text x="145" y="757" font-size="11" fill="#334155">Booking → Hotel: availability check before booking</text>

<!-- Violet dashed -->
<line x1="75" y1="778" x2="135" y2="778" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ah-v)"/>
<text x="145" y="783" font-size="11" fill="#334155">Review → Hotel: push aggregated rating (via cron)</text>

<!-- right column of legend -->
<rect x="580" y="690" width="12" height="12" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="600" y="702" font-size="11" fill="#334155">Go service</text>

<rect x="580" y="716" width="12" height="12" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="600" y="727" font-size="11" fill="#334155">TypeScript / Node.js service</text>

<rect x="580" y="742" width="12" height="12" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="600" y="753" font-size="11" fill="#334155">Redis — queues, locking, caching</text>

<rect x="580" y="768" width="12" height="12" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="600" y="779" font-size="11" fill="#334155">MySQL — persistent storage per service</text>

<text x="900" y="705" font-size="11" fill="#334155">Rate limit: 5 req/s per IP (token bucket)</text>
<text x="900" y="728" font-size="11" fill="#334155">All proxy routes require valid JWT</text>
<text x="900" y="751" font-size="11" fill="#334155">X-Correlation-ID forwarded across all hops</text>
<text x="900" y="774" font-size="11" fill="#334155">UTC timezone enforced on all DB connections</text>
</svg>
